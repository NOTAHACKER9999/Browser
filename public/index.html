<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scramjet Proxy</title>
<style>
body{
background:#000;
color:#fff;
font-family:Arial;
text-align:center;
margin-top:50px;
}
input{
width:400px;
padding:10px;
font-size:18px;
}
button{
padding:10px 20px;
font-size:18px;
}
iframe{
width:100%;
height:90vh;
border:none;
margin-top:20px;
}
</style>
</head>

<body>

<h1>Scramjet Proxy</h1>

<input id="url" placeholder="Enter URL">
<button onclick="go()">Go</button>

<iframe id="frame"></iframe>

<script>
function go(){
let url=document.getElementById("url").value;

if(!url.startsWith("http")){
url="https://"+url;
}

document.getElementById("frame").src="/scramjet/"+btoa(url);
}
</script>

</body>
</html>
