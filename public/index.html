<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scramjet</title>

<style>
body{
background:#000;
color:white;
font-family:Arial;
text-align:center;
margin-top:100px;
}

input{
width:400px;
padding:10px;
font-size:18px;
}

button{
padding:10px 20px;
font-size:18px;
}

iframe{
width:100%;
height:90vh;
border:none;
margin-top:20px;
}
</style>
</head>

<body>

<h1>Scramjet Proxy</h1>

<input id="url" placeholder="Enter URL">
<button onclick="go()">Open</button>

<iframe id="frame"></iframe>

<script src="/scram/scramjet.client.js"></script>

<script>

const scramjet = new Scramjet({
    prefix: "/scram/",
    files: {
        worker: "/scram/scramjet.worker.js",
        wasm: "/scram/scramjet.wasm"
    }
});

async function start(){
    await scramjet.init();

    if("serviceWorker" in navigator){
        await navigator.serviceWorker.register("/scram/scramjet.sw.js",{
            scope:"/"
        });
    }
}

start();

function go(){

let url=document.getElementById("url").value;

if(!url.startsWith("http")){
url="https://"+url;
}

document.getElementById("frame").src="/scram/"+scramjet.encodeUrl(url);

}

</script>

</body>
</html>
